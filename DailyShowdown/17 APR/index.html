<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./dist/index.js" type="module" defer></script>
</head>
<body>
    <header id="header">
        <div id="chatting-with-user"></div>
        <button class="btn btn-primary" id="add-user-btn">Add</button>
        <select name="" id="select">
            <option value="" selected>Choose user</option>
        </select>
    </header>
    <main>
        <div class="chat-interface">
            <div class="form-group">
                <input type="text" placeholder="Inter your msg....">
            </div>
        </div>
    </main>
    <aside>
        <div class="left-user-panel" id="left-user-panel">
            <div class="left-user-panel-nameholder">
               <img class="profile-img" src="https://wallpapercave.com/fwp-510/wp16273645.webp" alt="">
                <span>Kshirsagar</span>
            </div>
        </div>
        <div class="backdrop-modal" id="add-user-modal">
            <div class="modal" >
                <h3>Add New User</h3>
                <form id="add-user-form">
                    <div class="form-group">
                        <input type="text" placeholder="Name" name="name">
                    </div>
                    <div class="form-group">
                        <input type="text" placeholder="Profile Photo Link" name="profile_photo_link">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary">Save</button>
                    </div>

                </form>
            </div>
        </div>
    </aside>
    <footer></footer>
</body>
</html>
